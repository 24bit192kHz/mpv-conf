### Profiles ###

[Deband-Medium]
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=24

[Deband-Strong]
deband-iterations=3
deband-threshold=64
deband-range=16
deband-grain=24

### Conditional Profiles ###

## Device fallback: Wayland + Vulkan on Linux (the maintainer's desktop).
## Other devices never match and keep gpu-context=auto, which selects the
## best context per platform (x11vk, winvk, cocoa, ...). ##
[linux-wayland-vulkan]
profile-cond=(function() return package.config:sub(1, 1) == "/" and os.getenv("WAYLAND_DISPLAY") ~= nil end)()
profile-restore=copy-equal
gpu-context=waylandvk

## NVIDIA on Linux gets explicit nvdec (auto-safe would pick vulkan-copy
## here); every other GPU keeps hwdec=auto-safe from mpv.conf. ##
[nvidia-linux-nvdec]
profile-cond=(function() local f = io.open("/proc/driver/nvidia/version", "r"); if f then f:close(); return true end return false end)()
profile-restore=copy-equal
hwdec=nvdec

## PipeWire where it runs (this machine); elsewhere mpv autoselects.
## (The socket can't be io.open'ed, so probe it with file_info -- the same
## trick the Anime profile uses.) ##
[linux-pipewire]
profile-cond=(function() local d = os.getenv("XDG_RUNTIME_DIR") or ""; return require("mp.utils").file_info(d .. "/pipewire-0") ~= nil end)()
profile-restore=copy-equal
ao=pipewire

[Downmix-Audio-5.1]
profile-cond=get("audio-params/channel-count", 0) >= 5 and get("audio-params/channel-count", 0) < 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Downmix-Audio-7.1]
profile-cond=get("audio-params/channel-count", 0) >= 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"

## General Anime Profile (Applies to any video in a folder called 'Anime') ##

[Anime]
# HDR excluded: Anime4K targets SDR; on pq/hlg sources the always-on
# HDR-safe base chain stays in place (see [hdr-passthrough] in mpv.conf).
profile-cond=(get("user-data/anime_detect/is_anime", "0") == "1" or (path ~= nil and require 'mp.utils'.join_path(working_directory, path):match('/[Aa]nime/') ~= nil)) and (get("video-params/gamma", "") ~= "pq" and get("video-params/gamma", "") ~= "hlg")
profile-restore=copy-equal

deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

sub-scale=0.85

# REPLACE (not append) the always-on KrigBilateral/SSim chain: appending
# stacked Anime4K's upscale on top of SSimSuperRes and luma was upscaled
# twice. Mode A chain, same as ALT+1; profile-restore puts the base
# chain back on exit.
glsl-shaders="~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_VL.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_M.glsl"
