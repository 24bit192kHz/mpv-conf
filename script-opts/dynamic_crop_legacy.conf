# Legacy cropdetect fallback backend, dofile'd by scripts/dynamic-crop.lua
# after fallback_failures consecutive CUDA scan failures.
# Own identifier (dynamic_crop_legacy) so its options never collide with the
# CUDA backend's dynamic_crop-* -- e.g. detect_limit=2 here is the legacy
# cropdetect threshold and must not be shared.
mode=4
read_ahead_mode=2
ratio_timer=2
read_ahead_sync=1
limit_timer=1.0
crop_method=1
