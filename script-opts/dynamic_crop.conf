# dynamic-crop CUDA backend options.
# Identifier is dynamic_crop (underscore): mpv sanitizes the hyphen in
# scripts/dynamic-crop.lua's script name. A hyphen-named conf file would be
# silently ignored -- verified empirically on mpv 0.41.
# Moved verbatim from mpv.conf's script-opts-append lines (review 2026-08).
enabled=yes
cycle_key=C
backend=cuda
project=~~/cuda-crop-cpp
binary=~~/cuda-crop-cpp/build/cuda-crop-cpp
daemon_idle_timeout=10.0
legacy_script=~~/script-modules/dynamic-crop-legacy.lua
fallback_failures=2
# panscan: video-crop + panscan. Subtitles keep their uncropped size and row
# (sub-ass-force-margins=yes in mpv.conf fits ASS dialogue to the visible
# crop; SRT does so natively). transform: video-zoom scales subs with the
# picture and clamps sub-pos.
apply_mode=panscan
panscan_letterbox=1.0
panscan_full=0.0
panscan_target_aspect=1.8
# Detection starts 0.3s ahead of playback; the wide read-ahead window below
# carries the real lookahead.
scan_ahead_seconds=0.3
scan_seconds=3
# Scan 10s of timeline per pass. Measured on RTX 3080 Ti (HEVC 1080p nvdec):
# 10s window = ~0.32s wall (31x realtime) -- fork+CUDA-init amortizes, so a
# big window is nearly free and makes scheduling immune to scan stalls
# (GPU contention, slow storage). Restore acceptance window grows with it.
read_ahead_seconds=10
apply_before_seconds=0.0
restore_before_seconds=0.0
# Apply 2 frames early so the crop lands ON the cut instead of ~1 frame
# after (baseline measurement: +12ms mean / +43ms max without lead).
presentation_lead_frames=2.0
presentation_lag_frames=0.0
symmetry_tolerance=96
min_letterbox_aspect=1.8
max_letterbox_aspect=2.60
min_letterbox_crop_ratio=0.03
# Letterbox crops keep ~full width; below this it is a logo/title card on
# black, not a letterbox (a 1280x720 intro got cropped to 558x228).
min_crop_width_ratio=0.70
restore_grace_seconds=0.0
# Restore gates (defaults: head 0.30 / min_lead 0.50 / transient 0.24).
# Tightened for rapid AR switching (IMAX-style content has genuine 0.25-0.5s
# segments that the old 0.24s transient suppression swallowed). With a 10s
# lookahead window the min-lead guard barely needs to exist.
restore_head_guard_seconds=0.10
restore_min_lead_seconds=0.15
transient_revert_seconds=0.10
# Anti-pumping: letterbox shots that cut into full-frame video and last less
# than this stay uncropped (bars shown) instead of zooming in and back out.
# JJK ep01: 20 letterbox shots, 15 under 3s; 3.0 removes 30 of 40 zooms and
# still crops 85% of letterboxed time. Restores are never delayed.
# 0 = follow every shot.
min_crop_seconds=3.0
# Startup hold: pause at file start until the first scan reports, so a
# letterboxed opening never shows an uncropped frame. Measured cost: motion
# starts 1.0s later on 1080p and 1.9s on 4K DV (the scan misses the 2s
# watchdog), on every launch -- mostly 16:9 episodes that never crop. Off:
# playback starts at once; a letterboxed opening zooms ~1s in, usually over
# logos/black.
startup_hold=no
startup_hold_timeout=2.0
# Rescan when fewer than min_lookahead_seconds of the 10s scanned window
# remain ahead of playback, or at once on a seek; scan_interval is only the
# longest wait. Back-to-back scans (scan_interval=0.01) re-decoded ~92% of
# every window: NVDEC at 35-75% during 1080p playback for crop detection.
scan_interval=5
min_lookahead_seconds=7
detect_limit=2
detect_round=2
# 2 votes: measured identical tracking with 1 on clean sources (the
# 2-frame presentation lead absorbs the ~0.08s confirmation), but 2 keeps
# a margin against single-frame boundary artifacts on noisier encodes.
min_votes=2
sample_step=1
# Tuning-time diagnostics; off in normal use (per-scan I/O).
telemetry=no
# Default IPC path for the sidecar. start_sidecar() prefers mpv's LIVE
# listener (this value under normal use, or a CLI --input-ipc-server
# override) and only binds this path when mpv listens on nothing, so
# extra listeners are never clobbered. Pinning the path keeps
# /tmp/mpvsocket stable for hyprshaderd HDR detection and remotes.
mpv_socket=/tmp/mpvsocket
