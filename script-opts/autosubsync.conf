# autosubsync config
#
# Pressing `n` now runs AUTOMATIC sync (autosubsync.lua / auto_sync):
#   1. If the file has an embedded TEXT subtitle (subrip/ass) -> sync to the
#      best one (English preferred, most cues) using altsub_subsync_tool.
#      Sub-second, only reads the subtitle stream -- safe on huge 4K remuxes.
#   2. Otherwise (PGS-only / image-based subs) -> audio VAD via
#      audio_subsync_tool. Bounded by --max-duration-seconds 600 inside
#      sync_subtitles so a long lossless 4K track can't trigger a multi-minute
#      decode; the .npz is cached per-video so the second run is instant.
# `ctrl+n` still opens the old interactive menu for manual reference/engine.
#
# The on-load auto path is: cached show-transform -> ffsubsync on the best
# embedded text sub (sub-to-sub, instant) -> audio VAD (only for PGS-only
# remuxes; .npz cached per video). The embedded sub is the default
# reference because the user wants the downloaded sub aligned to whatever
# is already muxed into the file. The cue gate (auto_sync_min_cues) keeps
# very sparse refs (signs/songs-only) on the audio path.

# Engine for the audio-reference fallback.
audio_subsync_tool=ffsubsync

# Engine for the embedded-subtitle path. alass (Rust) is ~3x faster than
# ffsubsync here and handles Arabic/UTF-8 fine (verified).
altsub_subsync_tool=alass

# Drop the original (unsynced) track after loading the retimed one.
unload_old_sub=yes

# --- automatic sync on subtitle load ---
# Sync a subtitle as soon as it gets selected (e.g. when subdl_ar loads the
# Arabic track) -- no keypress needed. Uses the fast embedded-sub path only.
auto_sync_on_load=yes
# Establish the per-show transform the first time a show plays, so every later
# episode applies it instantly. Defaults to audio VAD (reliable across any
# source); only falls back to a dense embedded sub when one exists. Guarded
# by audio_is_cheap so a long lossless 4K track (multi-minute decode) skips
# VAD and tries the embedded sub path.
auto_sync_audio=yes
# Skip auto-sync if the best embedded sub has fewer cues than this (a
# signs/songs track is too sparse to sync reliably; press n for audio then).
auto_sync_min_cues=100
# Wait this long after a sub is selected before syncing (lets the loader finish).
auto_sync_delay=0.7

# Cache the computed offset+framerate per SHOW folder and reuse it for every
# episode. The first episode of a show computes it (one file traversal); the
# rest apply it with pure timestamp math (milliseconds, no file access). The
# framerate scale is only trusted inside 0.90-1.10 (real PAL ~= 1.042); a bad
# scale from a sparse reference is dropped so it can't distort every episode.
# Press n to force a recompute for the current show.
cache_show_transform=yes
