# autosubsync config
#
# Pressing `n` now runs AUTOMATIC sync (autosubsync.lua / auto_sync):
#   1. If the file has an embedded TEXT subtitle (subrip/ass) -> sync to the
#      best one (English preferred, most cues) using altsub_subsync_tool.
#      Sub-second, only reads the subtitle stream -- safe on huge 4K remuxes.
#   2. Otherwise (PGS-only / image-based subs) -> audio VAD via
#      audio_subsync_tool. Bounded by --max-duration-seconds 600 inside
#      sync_subtitles so a long lossless 4K track can't trigger a multi-minute
#      decode; the .npz is cached per-video so the second run is instant.
# `ctrl+n` still opens the old interactive menu for manual reference/engine.
# `F12` wipes the cached transform for the current episode (forces a re-sync
# on the next play).
#
# The on-load auto path is: cached episode-transform -> ffsubsync on the best
# embedded text sub (sub-to-sub, instant) -> audio VAD (only for PGS-only
# remuxes; .npz cached per video). The embedded sub is the default
# reference because the user wants the downloaded sub aligned to whatever
# is already muxed into the file. The cue gate (auto_sync_min_cues) keeps
# very sparse refs (signs/songs-only) on the audio path.

# Engine for the audio-reference fallback.
audio_subsync_tool=ffsubsync

# Engine for the embedded-subtitle path. ffsubsync is the unambiguous
# default -- reports a clean offset+framerate pair (which we cache as the
# episode's transform) and handles stdbuf'd UTF-8 output. alass (Rust) is
# ~3x faster but its output is a retimed file only -- it does NOT report
# the offset, so caching the per-episode transform wouldn't work with it.
altsub_subsync_tool=ffsubsync

# Strip signs/songs/OP/ED/title-card cues from the .ass reference before
# passing it to the syncer. Anime "default forced" tracks mix dialogue with
# typewriter title-card cues / OP/ED karaoke -- those micro-cues cluster at
# the start and poison sub-to-sub alignment. On -> filter always; off ->
# pass the full .ass through.
dialogue_only_filter=yes

# ffsubsync --max-offset-seconds. Default 60 -- far too tight for
# release-cut differences (e.g. a coalgirls BD with 2-min recap vs an
# Arabic SubDL sub starting at the episode -> true alignment +120s).
# 600s = 10 min covers recap / OP-shift / cold-open shifts.
ffsubsync_max_offset=600

# Drop the original (unsynced) track after loading the retimed one.
unload_old_sub=yes

# --- automatic sync on subtitle load ---
# Sync a subtitle as soon as it gets selected (e.g. when subdl_ar loads the
# Arabic track) -- no keypress needed. Uses the fast embedded-sub path only.
auto_sync_on_load=yes
# Establish the per-episode transform the first time an episode plays, so
# replays of the SAME file apply it instantly. Each episode from a
# different SubDL source gets its own transform cache (SubDL returns a
# DIFFERENT Arabic sub release per episode -- coalgirls-720p, 1080p,
# sts-horrible, etc -- so the offsets against their respective videos are
# independent: Lain E01 required +0.72s while E07 required +119.62s against
# the same coalgirls BD).
auto_sync_audio=yes
# Skip auto-sync if the best embedded sub has fewer cues than this (a
# signs/songs track is too sparse to sync reliably; press n for audio then).
auto_sync_min_cues=100
# Wait this long after a sub is selected before syncing (lets the loader finish).
auto_sync_delay=0.7

# Cache the computed offset+framerate per EPISODE (path+size+mtime) and
# reuse it for replays of the same file (applying it is pure timestamp
# math -- milliseconds, no file access). First play of each episode pays
# the extract+ffsubsync cost (~1s); replays are instant. The framerate
# scale is only trusted inside 0.90-1.10 (real PAL ~= 1.042); a bad scale
# from a sparse reference is dropped so it can't distort replay.
# Press n to force a recompute for the current episode; F12 to wipe it.
cache_show_transform=yes
