# SSimDownscaler (perceptual downscaler) - for when source > output res (e.g. 4K BD on 1440p UW). Best with linear-downscaling=no (uncomment in mpv.conf if used always-on).
ALT+9 no-osd change-list glsl-shaders toggle "~~/shaders/SSimDownscaler.glsl"; show-text "SSimDownscaler: ${?glsl-shaders==*SSimDownscaler*:*on|*off}"
