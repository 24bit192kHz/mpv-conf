MBTN_LEFT cycle pause #@click
MBTN_LEFT script-binding evafast/speedup #@press
MBTN_LEFT script-binding evafast/slowdown #@release

ALT+d cycle deband
tab script-binding uosc/flash-ui
p script-binding webtorrent/toggle-info    
ctrl+d script-binding autodeint/autodeint  
ALT+b script-binding autosub/download_subs  
MOUSE_BTN2 script-binding uosc/menu-blurred 
U script-binding uosc/menu-blurred
ALT+a script-message-to uosc show-submenu-blurred "File"
ALT+z script-message-to uosc show-submenu-blurred "Audio"
ALT+x script-message-to uosc show-submenu-blurred "Subtitles"

### UOSC Menu Config ###

h script-binding memo-history                                                               #! File > History
/ script-binding console/enable                                                             #! File > Console
# script-binding uosc/playlist                                                              #! File > Playlist
# script-binding uosc/open-config-directory                                                 #! File > Settings
ALT+c script-binding uosc/chapters                                                          #! File > Chapters
b script-binding uosc/open-file                                                             #! File > Open File
# script-binding uosc/show-in-directory                                                     #! File > Open in File Explorer

# apply-profile Deband-Medium                                                               #! Video > Filters > Deband (Medium)
# apply-profile Deband-Strong                                                               #! Video > Filters > Deband (Strong)
g cycle interpolation                                                                       #! Video > Interpolation
# script-binding dynamic_crop/cycle-mode                                                    #! Video > Dynamic Crop > Cycle Mode
# script-message-to dynamic_crop set-mode continuous                                        #! Video > Dynamic Crop > Continuous
# script-message-to dynamic_crop set-mode one_shot                                          #! Video > Dynamic Crop > One-Shot
# script-message-to dynamic_crop set-mode disabled                                          #! Video > Dynamic Crop > Disabled
# script-binding uosc/video                                                                 #! Video > Select Video Track
		
F1 af toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]" ; show-text "${af}"                       #! Audio > Dialogue
# af clr ""                                                                                 #! Audio > Clear Filters 
# script-binding afilter/toggle-eqr                                                         #! Audio > Toggle Equalizer
a cycle audio-normalize-downmix                                                             #! Audio > Toggle Normalize
# script-binding afilter/toggle-dnm                                                         #! Audio > Toggle Normalizer
# script-binding afilter/toggle-drc                                                         #! Audio > Toggle Compressor
# script-binding uosc/audio                                                                 #! Audio > Select Audio Track

y script-binding uosc/load-subtitles                                                        #! Subtitles > Load
Y script-binding uosc/subtitles                                                             #! Subtitles > Select
v cycle sub-visibility                                                                       #! Subtitles > Toggle
V script-binding uosc/subtitles                                                             #! Subtitles > Select
ALT+j add sub-scale +0.05                                                                   #! Subtitles > Bigger
ALT+k add sub-scale -0.05                                                                   #! Subtitles > Smaller
z add sub-delay -0.1                                                                        #! Subtitles > Decrease Sub Delay
Z add sub-delay  0.1                                                                        #! Subtitles > Increase Sub Delay
# script-binding ar_subs/ar_subs_search                                                   #! Subtitles > Arabic Subs > Search Manually
# script-binding ar_subs/ar_subs_next                                                     #! Subtitles > Arabic Subs > Next Subtitle
# script-binding ar_subs/ar_subs_toggle_deep                                              #! Subtitles > Arabic Subs > Toggle Deep Search

#my
F1     script-message-to command_palette show-command-palette "Bindings" # Bindings
PGDWN playlist-prev
PGUP playlist-next
Ctrl+S no-osd set sub-delay 0

Ctrl+Left  add chapter -1  # Go to the previous chapter
Ctrl+Right add chapter 1   # Go to the next chapter
RIGHT seek 5               # Plain seek (overrides evafast hybrid)
LEFT seek -5               # Plain seek back
. frame-step              # Frame forward (YouTube-style)
, frame-back-step         # Frame backward (YouTube-style)
> frame-step              # Frame forward (shifted . fallback)
< frame-back-step         # Frame backward (shifted , fallback)
KP_DEC frame-step         # Frame forward (keypad decimal)
KP_DEL frame-step         # Frame forward (keypad decimal)
UP seek 30

CTRL+2 cycle-values tone-mapping "bt.2446a" "off" ; show-text "Tone-map"
M cycle-values af "lavfi=[pan=mono|c0=0.5*c0+0.5*c1]" ""

### Anime4K v4.x (HQ, high-end GPU) ###
ALT+1 no-osd change-list glsl-shaders set "~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_VL.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/anime4k/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
