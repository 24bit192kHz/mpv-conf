profile=gpu-hq
display-tags=
cache=yes
demuxer-max-bytes=2G
demuxer-max-back-bytes=128M
demuxer-readahead-secs=30
cache-secs=30
cache-on-disk=no
cache-pause=no
cache-pause-wait=3
demuxer-mkv-probe-video-duration=no
### Dynamic crop
script-opts-append=dynamic_crop-enabled=yes
script-opts-append=dynamic_crop-cycle_key=C
script-opts-append=dynamic_crop-backend=cuda
script-opts-append=dynamic_crop-project=~~/cuda-crop-cpp
script-opts-append=dynamic_crop-binary=~~/cuda-crop-cpp/build/cuda-crop-cpp
script-opts-append=dynamic_crop-daemon_idle_timeout=10.0
script-opts-append=dynamic_crop-legacy_script=~~/script-modules/dynamic-crop-legacy.lua
script-opts-append=dynamic_crop-fallback_failures=2
script-opts-append=dynamic_crop-apply_mode=transform
script-opts-append=dynamic_crop-panscan_letterbox=1.0
script-opts-append=dynamic_crop-panscan_full=0.0
script-opts-append=dynamic_crop-panscan_target_aspect=1.8
script-opts-append=dynamic_crop-scan_ahead_seconds=0.5
script-opts-append=dynamic_crop-scan_seconds=3
script-opts-append=dynamic_crop-read_ahead_seconds=2
script-opts-append=dynamic_crop-apply_before_seconds=0.0
script-opts-append=dynamic_crop-restore_before_seconds=0.0
script-opts-append=dynamic_crop-presentation_lead_frames=0.0
script-opts-append=dynamic_crop-presentation_lag_frames=0.0
script-opts-append=dynamic_crop-symmetry_tolerance=96
script-opts-append=dynamic_crop-min_letterbox_aspect=1.8
script-opts-append=dynamic_crop-max_letterbox_aspect=2.60
script-opts-append=dynamic_crop-min_letterbox_crop_ratio=0.03
script-opts-append=dynamic_crop-restore_grace_seconds=0.0
script-opts-append=dynamic_crop-scan_interval=0.01
script-opts-append=dynamic_crop-detect_limit=2
script-opts-append=dynamic_crop-detect_round=2
script-opts-append=dynamic_crop-min_votes=2
script-opts-append=dynamic_crop-sample_step=1
script-opts-append=dynamic_crop-telemetry=yes
# Legacy fallback backend options.
script-opts-append=dynamic_crop-mode=4
script-opts-append=dynamic_crop-read_ahead_mode=2
script-opts-append=dynamic_crop-ratio_timer=2
script-opts-append=dynamic_crop-read_ahead_sync=1
script-opts-append=dynamic_crop-limit_timer=1.0
script-opts-append=dynamic_crop-crop_method=1

vo=gpu-next
gpu-context=waylandvk
#hdr-compute-peak=yes
#tone-mapping=auto
hwdec=nvdec
#gpu-api=vulkan
target-colorspace-hint=yes
target-colorspace-hint-mode=source-dynamic
tone-mapping=auto
gamut-mapping-mode=perceptual
### HDR source -> HDR display ###
[hdr-passthrough]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy-equal
#title=hyprlightd-hdr mpv
target-prim=bt.2020
target-trc=pq
target-gamut=dci-p3
#target-peak=600
target-contrast=inf
#target-colorspace-hint-mode=source-dynamic
target-colorspace-hint-mode=source
tone-mapping=st2094-40
gamut-mapping-mode=perceptual
hdr-reference-white=275
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
hdr-compute-peak=no
video-sync=audio
interpolation=no
video-output-levels=full
### SDR (no tone mapping at all) ###
[sdr-native]
profile-cond=get("video-params/primaries") ~= "bt.2020"
#title=sdr mpv
tone-mapping=clip
#target-colorspace-hdr=auto
#target-colorspace-hint=yes
target-colorspace-hint-mode=target
scale-antiring=0.6
dscale-antiring=0.6
cscale-antiring=0.6
video-sync=audio
interpolation=no
tscale=oversample
temporal-dither=yes
### Debanding (off unless needed) ###
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32
### Audio & Subtitles ###
slang=ar,ara,Arabic,en,eng
alang=ja,jpn,jap,Japanese,en,eng,English
sub-blur=0.35
sub-bold=yes
sub-scale=0.85
sub-margin-y=25
sub-font='Calibri'
sub-font-size=30
sub-codepage=cp1256
sub-shadow-offset=0.4
sub-border-size=0.85
sub-auto=all
sub-ass-override=force
blend-subtitles=yes
audio-channels=auto-safe
audio-buffer=1.0
pipewire-buffer=1024
ao=pipewire
#audio-spdif=ac3,eac3,dts,dts-hd,truehd
volume-max=100
sub-fix-timing=yes
audio-file-auto=fuzzy
demuxer-mkv-subtitle-preroll=yes
sub-file-paths=sub;subs;subtitles
### General ###
fs=yes
snap-window
keep-open=always
geometry=50%:50%
save-position-on-quit=yes
watch-later-options-remove=pause
watch-later-options-remove=vf
watch-later-options-remove=video-crop
hr-seek=no
### OSD ###
osc=no
border=no
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font=calibri
### Screenshots ###
screenshot-template="/home/btw/Pictures/mpv/%F [%wH.%wM.%wS.%wT]"
screenshot-format=png
screenshot-tag-colorspace=yes
screenshot-png-compression=5
### Terminal ###
msg-color=yes
msg-module=yes
msg-level=auto_profiles=no
msg-level=ytdl_hook=no,ffmpeg=no
msg-level=all=warn,dynamic_crop=info
msg-level=thumbfast=error
msg-level=ffmpeg=no
