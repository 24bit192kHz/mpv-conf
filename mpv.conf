profile=high-quality
# Conditional profiles (device fallbacks, HDR/SDR, audio downmix, Anime)
include=~~/profiles.conf
### Upscaling base (always-on, HDR-safe) ###
# KrigBilateral = chroma scaler (luma-guided, beats bilinear default)
# SSimSuperRes  = post-upscale ringing correction + sharpness restore
# SSimDownscaler = perceptual downscaler (best for source > output res)
glsl-shaders="~~/shaders/KrigBilateral.glsl:~~/shaders/SSimSuperRes.glsl:~~/shaders/SSimDownscaler.glsl"
scale=ewa_lanczossharp
dscale=mitchell
cscale=gaussian
linear-downscaling=no
# Sigmoid pre-blur double-processes with SSimSuperRes (which already
# sharpens + anti-rings as a post-correction) -- give it a clean result.
sigmoid-upscaling=no
display-tags=
cache=yes
demuxer-max-bytes=2G
demuxer-max-back-bytes=128M
demuxer-readahead-secs=30
cache-secs=30
cache-on-disk=no
cache-pause=no
cache-pause-wait=3
demuxer-mkv-probe-video-duration=no
### Streaming (yt-dlp) ###
# Progressive ("best") first -- verified against yt-dlp 2026.06 client
# rotation: pure bestvideo+bestaudio dash picks landed on a 403-ing
# player_client on this network, progressive didn't. Dash split below as
# fallback for quality ceilings progressive can't reach, then anything.
# "<=?" = soft cap: prefer <=1440p, never fail if unavailable. uosc's
# stream_quality_options menu still overrides quality per-session.
ytdl-format=best[height<=?1440]/bestvideo[height<=?1440]+bestaudio/best
### Dynamic crop ###
# Backend options: script-opts/dynamic_crop.conf (CUDA backend) and
# script-opts/dynamic_crop_legacy.conf (dofile'd cropdetect fallback, own
# identifier so its values never collide with dynamic_crop-*).

# gpu-next drops the subtitle plane on seeks (subs appear ~2s late or
# not at all until the next packet flush). gpu renders them immediately
# on seek and looks identical for this content.
vo=gpu
# IPC socket for hyprshaderd HDR detection. mpv 0.39+ supports multiple IPC
# servers, so this coexists with dynamic-crop's runtime sidecar socket.
input-ipc-server=/tmp/mpvsocket
# Device-adaptive: gpu-context=waylandvk and hwdec=nvdec are applied by the
# conditional profiles in profiles.conf on this machine (Linux + Wayland +
# NVIDIA). Every other device stays on auto: gpu-context picks x11vk/winvk/
# cocoa, hwdec=auto-safe picks the best decoder per GPU (vaapi / d3d11va /
# videotoolbox), ao=auto picks pipewire/wasapi/coreaudio.
#hdr-compute-peak=yes
#tone-mapping=auto
hwdec=auto-safe
#gpu-api=vulkan
target-colorspace-hint=yes
target-colorspace-hint-mode=source-dynamic
tone-mapping=auto
gamut-mapping-mode=perceptual
### Debanding (off unless needed) ###
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32
### Audio & Subtitles ###
slang=ar,ara,Arabic,en,eng
alang=ja,jpn,jap,Japanese,en,eng,English
sub-blur=0.35
sub-bold=yes
sub-scale=0.85
sub-margin-y=25
sub-font='Calibri'
sub-font-size=30
sub-codepage=cp1256
sub-shadow-offset=0.4
sub-border-size=0.85
sub-auto=all
# sub-ass-override=force removed: it makes EMBEDDED MKV ASS tracks
# invisible (external ASS/SRT still rendered). Arabic fansubs like One
# Pace ship their subs inside the MKV, so force blanked them entirely.
# The user sub-* styling still applies to SRT/external text subs.
blend-subtitles=yes
audio-channels=auto-safe
audio-buffer=1.0
pipewire-buffer=1024
# No explicit ao=: mpv's autoselect is the best-per-device fallback
# (wasapi/coreaudio/pulse...). This machine gets ao=pipewire pinned by the
# [linux-pipewire] conditional profile in profiles.conf.
#audio-spdif=ac3,eac3,dts,dts-hd,truehd
volume-max=100
sub-fix-timing=yes
audio-file-auto=fuzzy
demuxer-mkv-subtitle-preroll=yes
sub-file-paths=sub;subs;subtitles
### General ###
fs=yes
snap-window
keep-open=always
geometry=50%:50%
save-position-on-quit=yes
watch-later-options-remove=pause
watch-later-options-remove=vf
watch-later-options-remove=video-crop
hr-seek=no
### OSD ###
osc=no
border=no
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font=calibri
### Screenshots ###
screenshot-template="~/Pictures/mpv/%F [%wH.%wM.%wS.%wT]"
screenshot-format=png
screenshot-tag-colorspace=yes
screenshot-png-compression=5
### Terminal ###
msg-color=yes
msg-module=yes
# Keep the terminal log rich (track lists, AO/VO, script messages): only
# silence known spam sources, no all= cap. The old five separate msg-level
# lines lived inside the [sdr-native] profile block below by accident --
# merged into one in f2eeeeb, which activated the all=warn cap for the
# first time and silenced playback info. Profiles now sit at the end of
# this file, where profile sections belong.
# yt-dlp broken again? temporarily override on the CLI:
# mpv --msg-level=ytdl_hook=debug <url>
msg-level=ffmpeg=no,ytdl_hook=no,thumbfast=error

### Conditional profiles: everything below a [header] belongs to that ###
### profile -- keep global options above this line.                   ###

### HDR source -> HDR display ###
[hdr-passthrough]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy-equal
#title=hyprlightd-hdr mpv
target-prim=bt.2020
target-trc=pq
target-gamut=dci-p3
#target-peak=600
target-contrast=inf
#target-colorspace-hint-mode=source-dynamic
target-colorspace-hint-mode=source
tone-mapping=st2094-40
gamut-mapping-mode=perceptual
hdr-reference-white=275
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
hdr-compute-peak=no
video-sync=audio
interpolation=no
video-output-levels=full
# SSim shaders assume gamma-2 SDR math (invalid under PQ/HLG); keep only
# the transfer-agnostic KrigBilateral chroma scaler for HDR.
glsl-shaders="~~/shaders/KrigBilateral.glsl"
### SDR (no tone mapping at all) ###
[sdr-native]
profile-cond=get("video-params/primaries") ~= "bt.2020"
profile-restore=copy-equal
#title=sdr mpv
tone-mapping=clip
#target-colorspace-hdr=auto
#target-colorspace-hint=yes
target-colorspace-hint-mode=target
scale-antiring=0.6
dscale-antiring=0.6
cscale-antiring=0.6
video-sync=audio
interpolation=no
tscale=oversample
temporal-dither=yes
